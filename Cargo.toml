[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.100"
repository = "https://github.com/jcarver989/foxfire"

[workspace.dependencies]
agent-client-protocol = { version = "=5.0.0", features = ["unstable_auth_status", "unstable_protocol_v2", "unstable_session_set_title", "unstable_subagents"] }
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde"] }
clankerdiff-client = { version = "0.10.3", default-features = false }
clankerdiff-core = "0.10.3"
clankerdiff-git = "0.10.3"
clankerdiff-lspd = "0.10.3"
clankerdiff-markdown = "0.10.3"
clankerdiff-protocol = "0.10.3"
clankerdiff-ratatui = { version = "0.10.3", features = ["crossterm-backend"] }
clankerdiff-remote = "0.10.3"
clankerdiff-rouge = "0.10.3"
clankerdiff-server = "0.10.3"
clankerdiff-symbols = "0.10.3"
clankerdiff-ui-core = "0.10.3"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
foxfire-acp = { path = "crates/foxfire-acp", version = "0.1.1" }
foxfire-core = { path = "crates/foxfire-core", version = "0.1.1" }
foxfire-ui = { path = "crates/foxfire-ui" }
foxfire-tui = { path = "crates/foxfire-tui", version = "0.1.1" }
futures = "0.3.32"
indexmap = "2"
log = "0.4.34"
mimalloc = { version = "0.1.52", default-features = false }
mime_guess = "2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "scrolling-regions"] }
regex = "1.12.4"
rouge = "0.4.0"
rouge-syntax = "0.4.0"
rouge-widgets = "0.4.0"
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.52.3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-width = "0.2.2"
url = "2.5"
uuid = { version = "1.23", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[workspace.lints.cargo]
pedantic = { level = "warn", priority = -1 }

# Keep Foxfire and Clankerdiff on one local Rouge dependency graph.
[patch.crates-io]
clankerdiff-client = { path = "../diff/crates/diff/client" }
clankerdiff-core = { path = "../diff/crates/diff/core" }
clankerdiff-fingerprint = { path = "../diff/crates/util/fingerprint" }
clankerdiff-git = { path = "../diff/crates/diff/git" }
clankerdiff-lspd = { path = "../diff/crates/util/lspd" }
clankerdiff-markdown = { path = "../diff/crates/diff/markdown" }
clankerdiff-protocol = { path = "../diff/crates/diff/protocol" }
clankerdiff-ratatui = { path = "../diff/crates/diff/ratatui" }
clankerdiff-remote = { path = "../diff/crates/util/remote" }
clankerdiff-rouge = { path = "../diff/crates/diff/rouge" }
clankerdiff-server = { path = "../diff/crates/diff/server" }
clankerdiff-symbols = { path = "../diff/crates/diff/symbols" }
clankerdiff-ui-core = { path = "../diff/crates/ui/core" }
clankerdiff-watch = { path = "../diff/crates/diff/watch" }
rouge = { path = "../rouge/crates/rouge" }
rouge-core = { path = "../rouge/crates/rouge-core" }
rouge-macros = { path = "../rouge/crates/rouge-macros" }
rouge-markdown = { path = "../rouge/crates/rouge-markdown" }
rouge-reactive = { path = "../rouge/crates/rouge-reactive" }
rouge-render = { path = "../rouge/crates/rouge-render" }
rouge-syntax = { path = "../rouge/crates/rouge-syntax" }
rouge-theme = { path = "../rouge/crates/rouge-theme" }
rouge-widgets = { path = "../rouge/crates/rouge-widgets" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dist]
inherits = "release"
lto = "thin"
