[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
agent-client-protocol = { version = "=5.0.0", features = ["unstable_auth_status", "unstable_protocol_v2", "unstable_session_set_title", "unstable_subagents"] }
base64 = "0.23"
clankerdiff-client = { path = "../diff/crates/diff/client", default-features = false }
clankerdiff-core = { path = "../diff/crates/diff/core" }
clankerdiff-git = { path = "../diff/crates/diff/git" }
clankerdiff-lspd = { path = "../diff/crates/util/lspd" }
clankerdiff-protocol = { path = "../diff/crates/diff/protocol" }
clankerdiff-ratatui = { path = "../diff/crates/diff/ratatui", features = ["crossterm-backend"] }
clankerdiff-remote = { path = "../diff/crates/util/remote" }
clankerdiff-server = { path = "../diff/crates/diff/server" }
clankerdiff-ui-core = { path = "../diff/crates/ui/core" }
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
foxfire-acp = { path = "crates/foxfire-acp", version = "0.1.0" }
foxfire-core = { path = "crates/foxfire-core", version = "0.1.0" }
futures = "0.3.32"
log = "0.4.34"
mime_guess = "2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "scrolling-regions"] }
rouge-syntax = { path = "../rouge/crates/rouge-syntax" }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.52.3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-width = "0.2.2"
url = "2.5"
wasm-bindgen-futures = "0.4.78"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[workspace.lints.cargo]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
