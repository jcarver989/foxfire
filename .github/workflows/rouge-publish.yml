# Generated by framer. Do not edit by hand: change .framer/src/main.rs and run `cargo framer`.
name: Publish Rouge app
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Check packages, publish a preview, or release to production
        type: choice
        options: [check, preview, production]
        default: check
      target:
        description: Target to run
        type: choice
        options: [all, ios, android]
        default: all
      build_number:
        description: Optional store build number override (defaults to GitHub run number)
        type: string
concurrency:
  group: rouge-app-publish
  cancel-in-progress: false
env:
  ROUGE_CHANNEL: ${{ inputs.channel }}
  ROUGE_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
permissions:
  contents: read
jobs:
  ios:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.target == 'all' || inputs.target == 'ios') && inputs.channel != 'production' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    environment: ${{ inputs.channel == 'check' && 'rouge-package-check' || format('rouge-ios-{0}', inputs.channel) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - name: Build iOS device archive
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ inputs.channel == 'preview' && secrets.APPLE_API_KEY || '' }}
          APPLE_KEY_ID: ${{ inputs.channel == 'preview' && secrets.APPLE_KEY_ID || '' }}
          APPLE_ISSUER_ID: ${{ inputs.channel == 'preview' && secrets.APPLE_ISSUER_ID || '' }}
        run: cargo rouge build ios
      - name: Save package for inspection
        if: ${{ inputs.channel == 'check' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rouge-ios-check
          path: .rouge/out/ios/unsigned-app.zip
          if-no-files-found: error
          overwrite: "true"
          include-hidden-files: "true"
      - name: Save iOS crash symbols
        if: ${{ inputs.channel == 'preview' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rouge-ios-dsyms
          path: .rouge/out/ios/dSYMs.zip
          if-no-files-found: error
          overwrite: "true"
          include-hidden-files: "true"
      - name: Upload to App Store Connect
        if: ${{ inputs.channel == 'preview' }}
        env:
          APPLE_API_KEY: ${{ inputs.channel == 'preview' && secrets.APPLE_API_KEY || '' }}
          APPLE_KEY_ID: ${{ inputs.channel == 'preview' && secrets.APPLE_KEY_ID || '' }}
          APPLE_ISSUER_ID: ${{ inputs.channel == 'preview' && secrets.APPLE_ISSUER_ID || '' }}
        run: cargo rouge publish ios
  android:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.target == 'all' || inputs.target == 'android') && inputs.channel != 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.channel == 'check' && 'rouge-package-check' || format('rouge-android-{0}', inputs.channel) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: "16111833"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Install Android build tools
        run: cargo rouge setup android
      - name: Build and verify Android App Bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ inputs.channel == 'preview' && secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 || '' }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ inputs.channel == 'preview' && secrets.ANDROID_UPLOAD_STORE_PASSWORD || '' }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ inputs.channel == 'preview' && secrets.ANDROID_UPLOAD_KEY_ALIAS || '' }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ inputs.channel == 'preview' && secrets.ANDROID_UPLOAD_KEY_PASSWORD || '' }}
        run: cargo rouge build android
      - name: Save package for inspection
        if: ${{ inputs.channel == 'check' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rouge-android-check
          path: .rouge/out/android/app.aab
          if-no-files-found: error
          overwrite: "true"
          include-hidden-files: "true"
      - name: Save verified bundle for Play upload
        if: ${{ inputs.channel == 'preview' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rouge-android-preview
          path: .rouge/out/android/app.aab
          if-no-files-found: error
          overwrite: "true"
          include-hidden-files: "true"
  android-preview:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.target == 'all' || inputs.target == 'android') && inputs.channel == 'preview' }}
    needs: [android]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 25
    environment: rouge-android-preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rouge-android-preview
          path: .rouge/out/android
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          export_environment_variables: "false"
      - name: Upload verified bundle to Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: dev.foxfire.app
          releaseFiles: .rouge/out/android/app.aab
          tracks: internal
          status: completed
      - name: Print Google Play link
        run: cargo rouge link android
