# Generated by framer. Do not edit by hand: change .framer/src/main.rs and run `cargo framer`.
name: Publish Rouge app
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Check packages, publish a preview, or release to production
        type: choice
        options: [check, preview, production]
        default: check
      target:
        description: Target to run
        type: choice
        options: [all, ios]
        default: all
      build_number:
        description: Optional store build number override (defaults to GitHub run number)
        type: string
concurrency:
  group: rouge-app-publish
  cancel-in-progress: false
env:
  ROUGE_CHANNEL: ${{ inputs.channel }}
  ROUGE_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
permissions:
  contents: read
jobs:
  ios:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.target == 'all' || inputs.target == 'ios') }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: ${{ inputs.channel == 'check' && 'rouge-package-check' || format('rouge-ios-{0}', inputs.channel) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: "false"
      - name: Install signing tool
        if: ${{ inputs.channel != 'check' }}
        run: cargo rouge setup ios
      - name: Check signing setup
        if: ${{ inputs.channel != 'check' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: cargo rouge doctor ios
      - name: Build iOS device package
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: cargo rouge build ios
      - name: Save package for inspection
        if: ${{ inputs.channel == 'check' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rouge-ios-check
          path: .rouge/out/ios/*
          if-no-files-found: error
      - if: ${{ inputs.channel == 'production' }}
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0
        with:
          ruby-version: "3.4"
      - name: Install Fastlane
        if: ${{ inputs.channel == 'production' }}
        run: gem install fastlane --no-document --version 2.232.2
      - name: Upload to App Store Connect
        if: ${{ inputs.channel != 'check' }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: cargo rouge publish ios
