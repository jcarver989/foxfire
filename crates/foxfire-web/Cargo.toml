[package]
name = "foxfire-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser host for the Foxfire UI"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
foxfire-shell = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rouge = { workspace = true }
rouge-widgets = { workspace = true }
wasm-bindgen = "0.2"

[dev-dependencies]
foxfire-core = { workspace = true }
foxfire-ui = { workspace = true, features = ["testing"] }
rouge = { workspace = true, features = ["persist"] }
rouge-widgets = { workspace = true }
foxfire-acp = { workspace = true, features = ["testing", "websocket"] }
foxfire-chat = { workspace = true }
foxfire-relay = { path = "../foxfire-relay" }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt"] }
