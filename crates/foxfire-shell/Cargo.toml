[package]
name = "foxfire-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Foxfire's shell for the shared conversation views"
publish = false

[package.metadata.dist]
dist = false

[features]
testing = []

[lints]
workspace = true

[dependencies]
agent-client-protocol = { workspace = true }
base64 = { workspace = true }
clankerdiff-core = { workspace = true }
clankerdiff-ui-core = { workspace = true }
foxfire-acp = { workspace = true, features = ["websocket"] }
foxfire-core = { workspace = true }
foxfire-ui = { workspace = true }
rouge = { workspace = true, features = ["open-url", "persist"] }
rouge-widgets = { workspace = true }
