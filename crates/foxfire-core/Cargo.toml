[package]
name = "foxfire-core"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "UI-agnostic Agent Client Protocol (ACP) client core shared by foxfire's frontends"
keywords = ["acp", "foxfire", "agent", "client"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "foxfire_core"
path = "src/lib.rs"

[[bin]]
name = "stdio-diff-server"
path = "tests/fixtures/stdio_diff_server.rs"
test = false
required-features = ["testing"]

[[test]]
name = "foxfire_core"
path = "tests/foxfire_core/main.rs"

[features]
testing = ["foxfire-acp/testing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
foxfire-acp = { workspace = true, features = ["client"] }
agent-client-protocol = { workspace = true, features = ["process"] }
clankerdiff-client = { workspace = true, features = ["websocket"] }
clankerdiff-server = { workspace = true }
clankerdiff-core = { workspace = true }
clankerdiff-remote = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "process", "io-std"] }
tracing = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
mime_guess = { workspace = true }
url = { workspace = true }

[dev-dependencies]
foxfire-core = { path = ".", features = ["testing"] }
foxfire-acp = { workspace = true, features = ["client", "testing"] }
clankerdiff-core = { workspace = true }
clankerdiff-remote = { workspace = true }
clankerdiff-git = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
