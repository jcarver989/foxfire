[package]
name = "foxfire-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Rouge UI for Foxfire frontends"
publish = false

[features]
testing = []

[lints]
workspace = true

[dependencies]
agent-client-protocol = { workspace = true }
base64 = { workspace = true }
clankerdiff-client = { workspace = true }
clankerdiff-core = { workspace = true }
clankerdiff-markdown = { workspace = true }
clankerdiff-rouge = { workspace = true }
clankerdiff-ui-core = { workspace = true }
foxfire-acp = { workspace = true }
foxfire-chat = { workspace = true }
foxfire-core = { workspace = true }
indexmap = { workspace = true }
rouge = { workspace = true, features = ["markdown", "open-url", "persist"] }
rouge-widgets = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
web-time = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
