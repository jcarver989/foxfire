[package]
name = "foxfire-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Rouge UI for the Foxfire desktop and web clients"
publish = false

[features]
testing = []

[lints]
workspace = true

[dependencies]
agent-client-protocol = { workspace = true }
base64 = { workspace = true }
clankerdiff-client = { workspace = true }
clankerdiff-core = { workspace = true }
clankerdiff-markdown = { workspace = true }
clankerdiff-rouge = { workspace = true }
clankerdiff-ui-core = { workspace = true }
foxfire-acp = { workspace = true }
foxfire-core = { workspace = true }
rouge = { workspace = true, features = ["markdown"] }
rouge-widgets = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
web-time = "1"
