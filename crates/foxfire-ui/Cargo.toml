[package]
name = "foxfire-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rouge views and headless controllers for Agent Client Protocol (ACP) apps"
keywords = ["acp", "agent", "chat", "foxfire", "rouge"]
categories = ["gui"]
publish = false

[features]
testing = ["dep:foxfire-chat"]

[lints]
workspace = true

[dependencies]
agent-client-protocol = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clankerdiff-client = { workspace = true }
clankerdiff-core = { workspace = true }
clankerdiff-markdown = { workspace = true }
clankerdiff-rouge = { workspace = true }
clankerdiff-ui-core = { workspace = true }
foxfire-acp = { workspace = true, features = ["websocket"] }
foxfire-chat = { workspace = true, optional = true }
foxfire-artifacts = { workspace = true, features = ["client"] }
foxfire-core = { workspace = true }
indexmap = { workspace = true }
rouge = { workspace = true, features = ["markdown", "open-url", "persist", "webview"] }
rouge-widgets = { workspace = true, features = ["webview"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rouge = { workspace = true, features = ["tokio-rt"] }

[dev-dependencies]
foxfire-ui = { path = ".", features = ["testing"] }
foxfire-acp = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
