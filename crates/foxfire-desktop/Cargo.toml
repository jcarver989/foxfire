[package]
name = "foxfire-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native desktop client for running and managing many ACP agent threads"
publish = false
default-run = "foxfire-desktop"

[lib]
name = "foxfire_desktop"
path = "src/lib.rs"

[[bin]]
name = "foxfire-desktop"
path = "src/main.rs"

[[bin]]
name = "fake-acp-agent"
path = "tests/fixtures/fake_acp_agent.rs"
test = false
required-features = ["testing"]

[features]
testing = [
    "foxfire-acp/testing",
    "foxfire-core/testing",
    "foxfire-ui/testing",
    "tokio/io-std",
    "clankerdiff-remote/test-support",
    "dep:tempfile",
]

[[test]]
name = "desktop"
path = "tests/desktop/main.rs"
required-features = ["testing"]

[package.metadata.dist]
dist = true

# dist would otherwise expect the `fake-acp-agent` test fixture, which release builds don't compile.
[package.metadata.dist.binaries]
aarch64-apple-darwin = ["foxfire-desktop"]
aarch64-unknown-linux-gnu = ["foxfire-desktop"]
x86_64-unknown-linux-gnu = ["foxfire-desktop"]

[lints]
workspace = true

[dependencies]
foxfire-acp = { workspace = true, features = ["client", "websocket"] }
agent-client-protocol = { workspace = true, features = ["process"] }
chrono = { workspace = true }
foxfire-core = { workspace = true }
foxfire-ui = { workspace = true }
clankerdiff-client = { workspace = true }
clankerdiff-core = { workspace = true }
clankerdiff-lspd = { workspace = true, features = ["daemon"] }
clankerdiff-markdown = { workspace = true }
clankerdiff-remote = { workspace = true }
clankerdiff-rouge = { workspace = true }
clankerdiff-ui-core = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
rouge = { workspace = true, features = ["tokio-rt", "open-url", "markdown", "persist"] }
rouge-widgets = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "process", "net"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
log = { workspace = true }
mimalloc = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
notify-rust = "4.18"

[dev-dependencies]
clankerdiff-core = { workspace = true, features = ["test-support"] }
clankerdiff-symbols = { workspace = true }
clankerdiff-server = { workspace = true }
foxfire-core = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
