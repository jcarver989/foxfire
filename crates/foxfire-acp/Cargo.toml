[package]
name = "foxfire-acp"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent Client Protocol (ACP) client utilities and Aether protocol extensions"
keywords = ["acp", "foxfire", "agent", "protocol"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["client"]
protocol = ["dep:agent-client-protocol", "dep:clankerdiff-protocol"]
client = ["protocol", "dep:futures", "dep:tokio", "dep:tokio-util", "dep:tracing", "dep:wasm-bindgen-futures"]
testing = ["client"]
websocket = ["client", "dep:gloo-net", "dep:tokio-tungstenite"]

[[example]]
name = "fake_agent_server"
required-features = ["testing", "websocket"]

[dependencies]
agent-client-protocol = { workspace = true, features = ["schemars"], optional = true }
clankerdiff-protocol = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util", "time"], optional = true }
tracing = { workspace = true, optional = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
agent-client-protocol = { workspace = true, features = ["wasm_js"], optional = true }
gloo-net = { version = "0.7", default-features = false, features = ["json", "websocket"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
foxfire-acp = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true, features = ["compat"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
