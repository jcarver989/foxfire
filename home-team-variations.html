:root{--canvas:#0d1117;--side:#0f141a;--rail:#0a0e13;--surface:#14181e;--hover:#1a1f26;--selected:#1c242e;--elevated:#171c23;--text:#e6edf3;--text2:#a6acb2;--muted:#7d848c;--faint:#565d66;--border:#3a4048;--subtle:#22272e;--accent:#58a6ff;--accent-fg:#000;--info:#58a6ff;--positive:#7ee787;--warning:#e0a15e;--destructive:#ff7b72;--shadow:rgba(0,0,0,.4);--page:#07090c;--L:.36}
[data-theme=sage]{--canvas:#0d1110;--side:#101514;--rail:#0a0e0d;--surface:#131918;--hover:#1a2322;--selected:#1e2928;--elevated:#171d1b;--text:#d4ddd6;--text2:#9ca5a0;--muted:#74877f;--faint:#54635d;--border:#3b4544;--subtle:#212928;--accent:#8fbcb0;--info:#82b1cc;--positive:#a7c080;--warning:#d8b56a;--destructive:#e67e80;--page:#060808}
[data-theme=light]{--canvas:#fff;--side:#f7f8f9;--rail:#eef0f2;--surface:#f8f9fa;--hover:#eef0f2;--selected:#e4e9ef;--elevated:#fff;--text:#1f2328;--text2:#565b61;--muted:#7a7f86;--faint:#a3a8ae;--border:#cfd3d8;--subtle:#e5e7ea;--accent:#0969da;--accent-fg:#fff;--info:#0969da;--positive:#116329;--warning:#a35a00;--destructive:#cf222e;--shadow:rgba(31,35,40,.16);--page:#e7e9ec;--L:.86}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--page);color:var(--text);font:400 13px/20px Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit;color:inherit;background:none;border:0;padding:0;outline:0;text-align:left}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}textarea:focus-visible,input:focus-visible{outline:0}
svg{display:block;flex:none}.code{font-family:Lilex,monospace;font-size:.92em}
.row{display:flex;align-items:center;gap:8px;min-width:0}.col{display:flex;flex-direction:column;min-width:0}.grow{flex:1 1 0;min-width:0}
.cap{font-size:11px;line-height:16px}.small{font-size:12px;line-height:16px}.strong{font-weight:500}.title{font-size:14px;line-height:20px;font-weight:500}.head{font-size:15px;line-height:20px;font-weight:600}.display{font-size:20px;line-height:28px;font-weight:600}.reading{font-size:15px;line-height:24px}
.t2{color:var(--text2)}.mut{color:var(--muted)}.warn{color:var(--warning)}.pos{color:var(--positive)}.neg{color:var(--destructive)}.num{font-variant-numeric:tabular-nums}.cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.abs{position:absolute;inset:0}
.mark{position:relative;flex:none;display:block}.mark i{position:absolute;border-radius:30%}.dot{width:8px;height:8px;border-radius:50%;flex:none}
[data-still] *{animation:none!important;transition:none!important}
/* page */
#page{height:100%;display:flex;flex-direction:column}
#picks{display:flex;align-items:center;gap:2px;padding:10px 16px 0;flex:none;overflow-x:auto;scrollbar-width:none}
#picks h1{font-size:13px;font-weight:600;margin-right:12px;white-space:nowrap}
.pick{padding:4px 10px;border-radius:6px;color:var(--muted);white-space:nowrap;font-size:12px;line-height:18px}.pick i{font-style:normal;color:var(--faint);margin-right:6px;font-variant-numeric:tabular-nums}.pick:hover{color:var(--text)}.pick.on{background:color-mix(in srgb,var(--text) 9%,transparent);color:var(--text)}
.knobs{margin-left:auto;display:flex;gap:4px;align-items:center;padding-left:16px}.knobs .pick{display:flex;gap:6px;align-items:center}
#stage{flex:1;min-height:0;padding:10px 16px 0}#window{position:relative;height:100%;border-radius:10px;overflow:hidden;background:var(--canvas);box-shadow:0 0 0 1px var(--subtle);isolation:isolate}
#notes{flex:none;padding:12px 20px 16px;display:grid;grid-template-columns:1.2fr 1.2fr 1fr 1fr;gap:28px;min-height:96px}#notes h2{font-size:12px;line-height:16px;font-weight:600;margin-bottom:2px}#notes p{font-size:12px;line-height:17px;color:var(--text2);max-width:54ch}
#fault{position:fixed;left:0;right:0;bottom:0;background:#b3261e;color:#fff;padding:8px 16px;font:12px/16px monospace;z-index:99;white-space:pre-wrap}
/* app */
